name: apk
on:
  push:
    paths: ['.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          node -e "const s=require('fs').readFileSync('worker.js','utf8');require('fs').writeFileSync('icon.png',Buffer.from(s.match(/const I512=\"([^\"]+)\"/)[1],'base64'))"
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www && echo '<!doctype html><title>chat</title>' > www/index.html
          echo '{"appId":"com.chat10.app","appName":"دردشة","webDir":"www","server":{"url":"https://chat10.moazhamdy833.workers.dev"}}' > capacitor.config.json
          npx cap add android
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in $R/mipmap-*dpi; do cp ../icon.png $d/ic_launcher.png; cp ../icon.png $d/ic_launcher_round.png; done
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/></manifest>#' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
